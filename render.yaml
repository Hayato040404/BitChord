# Render Blueprint for the BitChord web player.
#
# It creates two services from this repository:
#   * a Node web service for /api/yt, /api/media and /api/lyrics
#   * a static site for the Vite app, built with the relay's URL
#
# In the Render dashboard: New -> Blueprint -> connect this repository -> Apply.
# The service names must be unique; rename them here if Render says they are
# taken. The static site's VITE_RELAY_BASE_URL is filled from the relay's
# RENDER_EXTERNAL_URL, so no manual URL copying is needed.
services:
  - type: web
    name: bitchord-relay-hayato
    runtime: node
    region: singapore
    plan: free
    rootDir: web
    # The relay only needs Node; installing is not required at runtime, but it
    # also keeps pnpm/corepack available for diagnostics.
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node --experimental-strip-types relay/server.mjs --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0

  - type: web
    name: bitchord-web-hayato
    runtime: static
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:site
    staticPublishPath: app/dist
    # Client-side routes such as /home must return index.html on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: VITE_RELAY_BASE_URL
        fromService:
          type: web
          name: bitchord-relay-hayato
          envVarKey: RENDER_EXTERNAL_URL
      # Listen Together needs a real party WebSocket server. This placeholder
      # only satisfies the production build; replace it if you run one.
      - key: VITE_PARTY_SERVER_URL
        value: https://party.example.com
