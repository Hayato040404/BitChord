# Render Blueprint for the BitChord web player.
#
# It creates the static app only. The relay is deliberately NOT hosted on
# Render: YouTube blocks Render's shared datacenter egress (HTTP 403 "Sorry..."
# from InnerTube). Run web/relay/server.mjs on a Raspberry Pi or VPS and expose
# it through Cloudflare Tunnel instead, then set VITE_RELAY_BASE_URL below to
# that HTTPS URL.
#
# In the Render dashboard: New -> Blueprint -> connect this repository -> Apply.
services:
  - type: web
    name: bitchord-web-hayato
    runtime: static
    rootDir: web
    buildCommand: npm install --global pnpm@12.11.2 && pnpm install --frozen-lockfile && pnpm build:site
    staticPublishPath: app/dist
    # Client-side routes such as /home must return index.html on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Set this in the Render dashboard to the Cloudflare Tunnel URL, e.g.
      # https://relay.example.com (no trailing slash). Vite bakes it in at
      # build time, so changing it requires a redeploy.
      - key: VITE_RELAY_BASE_URL
        sync: false
      # Listen Together needs a real party WebSocket server. This placeholder
      # only satisfies the production build; replace it if you run one.
      - key: VITE_PARTY_SERVER_URL
        value: https://party.example.com
